<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function myNew( ctorFn, ...args){
            // todo:如果ctorFn为空，如何处理？
            const resObj = {}
            resObj.__proto__=ctorFn.prototype
            const applyRes = ctorFn.apply( resObj, args)
            // todo:这样返回，是否有问题？比如闭包，导致内存泄漏
            return applyRes ?? resObj
        }

        // ========== 正确实现（标准面试答案）==========
        function myNewCorrect(ctor, ...args) {
            // 1. 创建一个新对象，原型指向构造函数的 prototype
            const obj = Object.create(ctor.prototype);
            // 2. 执行构造函数，this 指向新对象
            const res = ctor.apply(obj, args);
            // 3. 构造函数显式返回对象则用该对象，否则返回新对象
            //    （instanceof Object 涵盖 object/function，原始值和 null 都会走 obj）
            return res instanceof Object ? res : obj;
        }

        // ========== 验证 ==========
        function Person(name) { this.name = name; }
        Person.prototype.say = function () { return this.name; };

        const p = myNewCorrect(Person, 'Tom');
        console.log(p instanceof Person); // true
        console.log(p.say());             // Tom

        // 构造函数显式返回对象：采用该对象
        function ReturningObj() { return { foo: 1 }; }
        console.log(myNewCorrect(ReturningObj)); // { foo: 1 }

        // 构造函数返回原始值：忽略，返回实例
        function ReturningPrimitive() { this.a = 1; return 42; }
        console.log(new ReturningPrimitive());        // ReturningPrimitive { a: 1 }
        console.log(myNew(ReturningPrimitive));       // 42（原实现的 bug）
        console.log(myNewCorrect(ReturningPrimitive)); // { a: 1 } ✅

        // ========== Reflect 版本（更现代）==========
        // 走引擎原生的 [[Construct]]，apply 版做不到的它都能做：
        // - 支持 class（class 不允许不带 new 调用，apply 会抛错）
        // - 支持 Map/Set 等必须用 new 调用的内置构造器
        // - 构造函数内 new.target 正确指向 ctor
        // - 第三个参数 newTarget 可指定用谁的 prototype（ES6 继承内置类的底层机制）
        function myNewReflect(ctor, ...args) {
            return Reflect.construct(ctor, args);
        }

        // 验证：class 用 apply 版会抛错，Reflect 版正常
        class Animal {
            constructor(name) { this.name = name; }
        }
        // myNewCorrect(Animal, 'cat') // 报错：Class constructor cannot be invoked without 'new'
        const a = myNewReflect(Animal, 'cat');
        console.log(a instanceof Animal, a.name); // true 'cat'

        // ========== 知识点：函数对象的 [[Call]] 与 [[Construct]] ==========
        // （规范术语是"内部方法 internal method"，和 [[Prototype]] 这类内部槽一样对 JS 不可见）
        //
        // [[Call]]      普通调用走的方法：fn() / fn.apply() / Reflect.apply()
        //               拥有它的对象是"可调用"（callable），typeof 据此返回 'function'
        // [[Construct]] new 调用走的方法：new fn() / Reflect.construct()
        //               拥有它的对象是"构造器"（constructor）
        //
        // 各类函数的持有情况：
        //   普通 function 声明/表达式      两个都有 → fn() 和 new fn() 都合法，
        //                                  所以 apply 版模拟对它们完全等价
        //   箭头函数/对象简写方法/class 方法  只有 [[Call]] → new 它们报 "is not a constructor"
        //   class 构造器/Map/Set 等内置     只有 [[Construct]] → 直接调用报
        //                                  "cannot be invoked without 'new'"
        //
        // 区分两种调用的手段是 new.target：
        //   [[Construct]] 执行时 new.target 指向构造器，[[Call]] 执行时是 undefined
        //   （反过来可用 if (!new.target) throw 把函数限制成"只能 new 调用"）
        //
        // 普通 [[Construct]] 的内部逻辑正是三步模拟的来源：
        //   以 newTarget.prototype 创建新对象 → 以它为 this 执行函数体 → 按返回值规则返回
        //
        // 落到本文件：myNewCorrect 借道 [[Call]]（ctor.apply），遇到只有
        // [[Construct]] 的 class/内置构造器就失效；myNewReflect 直接调用
        // [[Construct]]（Reflect.construct），与原生 new 语义一致
    </script>
</body>
</html>
